<path d="M960 335 C995 335 995 110 1030 110" class="lnb" marker-end="url(#ab)"/>
<rect x="1030" y="178" width="230" height="100" rx="16" class="card"/>
<text x="1048" y="216" class="fg tb" text-anchor="start">KubeVirt + Zorvia</text>
<text x="1048" y="240" class="mut ts" text-anchor="start">Ready, Zorvia lists it</text>
<circle cx="1236" cy="202" r="11" class="ok"/><path d="M1230 202 l4 4 l8 -9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M960 335 C995 335 995 228 1030 228" class="lnb" marker-end="url(#ab)"/>
<rect x="1030" y="296" width="230" height="100" rx="16" class="card dash"/>
<text x="1048" y="334" class="fg tb" text-anchor="start">Kairon</text>
<text x="1048" y="358" class="mut ts" text-anchor="start">via Veyron: not run yet</text>
<path d="M960 335 C995 335 995 346 1030 346" class="lnd" marker-end="url(#a)"/>
<rect x="1030" y="414" width="230" height="100" rx="16" class="card dash"/>
<text x="1048" y="452" class="fg tb" text-anchor="start">Machina</text>
<text x="1048" y="476" class="mut ts" text-anchor="start">libvirt host: not run yet</text>
<path d="M960 335 C995 335 995 464 1030 464" class="lnd" marker-end="url(#a)"/>
<rect x="20" y="528" width="1240" height="52" rx="12" class="chip"/>
<circle cx="46" cy="554" r="8" class="ok"/><text x="62" y="559" class="mut ts" text-anchor="start">run end to end</text>
