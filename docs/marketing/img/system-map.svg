<rect x="545" y="358" width="140" height="30" rx="9" class="chip"/><text x="615.0" y="378" class="fg tm" text-anchor="middle">manifest.json</text>
<path d="M480 335 L530 335" class="lnb" marker-end="url(#ab)"/>
