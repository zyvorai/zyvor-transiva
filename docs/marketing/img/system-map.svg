<rect x="750" y="215" width="210" height="240" rx="16" class="hl"/>
<text x="855" y="250" class="fg tb" text-anchor="middle">h2kvm</text>
<text x="855" y="272" class="mut ts" text-anchor="middle">first-boot science</text>
<rect x="770" y="292" width="170" height="30" rx="9" class="chip"/><text x="855.0" y="312" class="fg ts" text-anchor="middle">GuestKit repair</text>
<rect x="770" y="332" width="170" height="30" rx="9" class="chip"/><text x="855.0" y="352" class="fg ts" text-anchor="middle">convert + checksum</text>
<rect x="770" y="372" width="170" height="30" rx="9" class="chip"/><text x="855.0" y="392" class="fg ts" text-anchor="middle">domain XML</text>
